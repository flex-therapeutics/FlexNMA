[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexnma-sampler"
version = "1.0.0"
description = "Protein conformational sampling with FlexNMA"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "threadpoolctl"]

[project.scripts]
flexnma = "flexnma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.pt", "*_LICENSE", "resources/*", "data/*.pt"]
